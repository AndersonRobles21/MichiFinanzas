<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MichiFinanzas propuesta C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: cálido, cercano y ordenado; una app de dinero que se siente de casa sin verse infantil.
IDEA: la libreta de cuentas de la casa, con un gato que acompaña; crema como papel, berenjena como tinta.
PICTURE: el teléfono mismo, a tamaño real (393 × 852), navegable, y su gemelo oscuro al lado.
COLOUR and TYPE: crema #FFF8EF, berenjena #5B2A86, calicó y amarillo solo decorativos; Nunito para cifras y títulos, Inter para texto.
LAYOUT: cabecera con controles, teléfono(s) centrados, especificaciones debajo.
*/
:root{color-scheme:light dark;--page:light-dark(#F4EADC,#120E18);--page-ink:light-dark(#2B1E36,#FFF4E6);--page-ink2:light-dark(#6E6077,#C4B6CF);--page-line:light-dark(#E2D3BF,#2E2638);--page-card:light-dark(#FFFDF9,#1C1625)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--page);color:var(--page-ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 48px}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.top h1{font:800 clamp(26px,3.4vw,38px)/1.05 Nunito,sans-serif;margin:0 0 6px;text-wrap:balance}
.top p{margin:0;color:var(--page-ink2);max-width:62ch}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--page-card);border:1px solid var(--page-line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px;font-weight:600;font-size:14px;color:var(--page-ink2)}
.seg button[aria-pressed=true]{background:#5B2A86;color:#FFF8EF}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--page-line);background:var(--page-card);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:40px;font-size:14px}
.jump button[aria-pressed=true]{border-color:#5B2A86;box-shadow:inset 0 0 0 1px #5B2A86;font-weight:600}
.stage{display:flex;flex-wrap:wrap;justify-content:center;gap:32px}
.label{font:700 14px Nunito,sans-serif;color:var(--page-ink2);text-align:center;margin-bottom:22px}
.specs{margin-top:44px;background:var(--page-card);border:1px solid var(--page-line);border-radius:20px;padding:clamp(18px,3vw,32px)}
.specs h2{font:800 24px/1.1 Nunito,sans-serif;margin:0 0 6px}.specs h3{font:700 17px Nunito,sans-serif;margin:24px 0 10px}
.specs p{margin:0 0 10px;color:var(--page-ink2);max-width:75ch}
.tok{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tok div{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 8px;border:1px solid var(--page-line);border-radius:10px}
.tok i{width:28px;height:28px;border-radius:8px;flex:none;border:1px solid rgba(0,0,0,.12)}
.tok b{display:block;font-weight:600}.tok span{color:var(--page-ink2);font-family:ui-monospace,Consolas,monospace;font-size:12px}
.scroll{overflow-x:auto}
table.sp{border-collapse:collapse;width:100%;font-size:14px}table.sp th,table.sp td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--page-line);vertical-align:top}table.sp th{font-weight:600;color:var(--page-ink2);font-size:13px}
.note{font-size:13px;color:var(--page-ink2);margin-top:12px}

/* ============ Teléfono y temas de la app ============ */
.t-light{--bg:#FFF8EF;--surface:#FFFFFF;--sunk:#F8EEE2;--hero:#5B2A86;--on-hero:#FFF8EF;--on-hero2:#E6D6F2;--ink:#2B1E36;--ink2:#6E6077;--line:#EFE3D3;--field:#9C8F80;
 --primary:#5B2A86;--on-primary:#FFFFFF;--primary-soft:#EFE4F7;--pos:#237A50;--pos-soft:#E3F2E9;--neg:#C03636;--neg-soft:#FDEEEC;--warn:#8A5300;--warn-soft:#FFF1D6;
 --orange:#F2994A;--yellow:#F6C744;--plate:#FFF1DF;--shadow:0 1px 2px rgba(91,42,134,.06),0 8px 24px rgba(91,42,134,.07);--nav:#FFFFFF;--scrim:rgba(43,30,54,.38);
 --c1:#5B2A86;--c2:#F2994A;--c3:#E0B12E;--c4:#B48AD8;--c5:#8C5A3C;--c6:#E8A598;--c7:#7A6E86}
.t-dark{--bg:#1C1625;--surface:#271F33;--sunk:#211A2C;--hero:#3A2B52;--on-hero:#FFF4E6;--on-hero2:#D9C7EE;--ink:#FFF4E6;--ink2:#C4B6CF;--line:#3A3047;--field:#7E6F8C;
 --primary:#C9A7F0;--on-primary:#1C1625;--primary-soft:#3B2D52;--pos:#6FD3A0;--pos-soft:rgba(111,211,160,.14);--neg:#FF8C82;--neg-soft:rgba(255,140,130,.14);--warn:#F6C744;--warn-soft:rgba(246,199,68,.13);
 --orange:#F2A766;--yellow:#F6C744;--plate:#F6EADB;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);--nav:#231C2E;--scrim:rgba(8,5,12,.6);
 --c1:#C9A7F0;--c2:#F2A766;--c3:#F6C744;--c4:#8E62B8;--c5:#C79474;--c6:#F0B8AE;--c7:#A79BB3}
.phone{width:393px;height:852px;border-radius:44px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 0 0 10px #241B2E,0 0 0 11px #3A2E45,0 30px 60px rgba(30,15,40,.25);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;isolation:isolate}
@media(max-width:440px){.stage>div{width:100%}.phone{width:100%;height:min(852px,calc(100svh - 40px));border-radius:28px;box-shadow:0 0 0 6px #241B2E}}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font:600 14px Inter;color:var(--ink)}
.status span:last-child{display:flex;gap:5px;align-items:center}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 20px}
.bar h2{font:800 20px/1 Nunito,sans-serif;margin:0;flex:1;letter-spacing:.1px}
.bar .back{margin-left:-10px}
.ib{width:44px;height:44px;border:0;background:none;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--sunk)}
.body{flex:1;overflow-y:auto;padding:4px 16px 104px;scrollbar-width:thin}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.amt{font-family:Nunito,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--ink2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec h3{font:800 17px Nunito,sans-serif;margin:0}
.link{border:0;background:none;color:var(--primary);font-weight:600;font-size:14px;cursor:pointer;padding:10px 4px;margin:-10px -4px;display:inline-flex;align-items:center;gap:2px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.t-dark .card{box-shadow:none;border:1px solid var(--line)}
:where(.phone) :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
/* Gatos: tres tamaños; placa clara detrás cuando el fondo es oscuro */
.cat{position:relative;display:inline-grid;place-items:center;flex:none}
.cat img{position:relative;width:100%;height:100%;object-fit:contain}
.cat-L{width:148px;height:132px}.cat-M{width:96px;height:88px}.cat-S{width:44px;height:42px}
.cat.plate::before,.t-dark .cat::before{content:"";position:absolute;inset:6% 4% 2%;border-radius:50%;background:var(--plate)}
/* Inicio */
.hello{margin:2px 2px 14px;color:var(--ink2);font-size:15px}.hello b{color:var(--ink);font-weight:600}
.hero{position:relative;background:var(--hero);color:var(--on-hero);border-radius:24px;padding:18px 18px 16px;margin-top:30px}
.hero .cat{position:absolute;right:10px;top:-34px}
.hero small{display:block;color:var(--on-hero2);font-size:14px;padding-right:104px}
.hero .big{font-size:38px;line-height:1.1;margin:4px 0 14px;display:block}
.phone{container-type:inline-size}
@container (max-width:380px){.hero .big{font-size:31px}.qa{font-size:12.5px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split button{border:0;text-align:left;background:rgba(255,248,239,.1);color:var(--on-hero);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:44px}
.split button[aria-expanded=true]{background:rgba(255,248,239,.18)}
.split small{padding:0;display:flex;align-items:center;gap:6px}.split .amt{font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.acclist{margin:10px 0 0;padding:0;list-style:none;border-top:1px solid rgba(255,248,239,.16)}
.acclist li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;font-size:14px;border-bottom:1px solid rgba(255,248,239,.1)}
.acclist li span:first-child{display:flex;align-items:center;gap:8px}
.hero .more{width:100%;border:0;background:none;color:var(--on-hero);font-weight:600;display:flex;justify-content:center;align-items:center;gap:4px;padding:12px 0 2px;cursor:pointer;min-height:44px;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 2px;line-height:1.25;display:grid;justify-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);min-height:84px}
.t-dark .qa{box-shadow:none;border:1px solid var(--line)}
.qa i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.qa.in i{background:var(--pos-soft);color:var(--pos)}.qa.out i{background:var(--neg-soft);color:var(--neg)}.qa.tr i{background:var(--primary-soft);color:var(--primary)}
.month{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.metric small{display:block;color:var(--ink2);font-size:13px}.metric .amt{font-size:21px}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.caption{font-size:13px;color:var(--ink2);margin:8px 0 0}
.saving{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:14px}
/* Próximos pagos */
.due{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0;padding-bottom:2px}.due:first-child{padding-top:2px}
.date{width:52px;height:52px;border-radius:14px;background:var(--sunk);display:grid;place-content:center;text-align:center;line-height:1.05}
.date b{font:800 19px Nunito,sans-serif}.date span{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink2);letter-spacing:.4px}
.due .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.due .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.soft{background:var(--sunk);color:var(--ink2)}.tag.lock{background:var(--sunk);color:var(--ink2)}
.right{text-align:right;display:grid;justify-items:end;gap:3px}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--primary)}
/* Movimientos */
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.row:last-child{border-bottom:0}
.bub{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.debt{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sunk) 8px 9px);border-radius:14px;padding-inline:8px;margin:4px -8px;width:calc(100% + 16px);border:1px dashed var(--line)}
.day{font:700 13px Inter;color:var(--ink2);margin:16px 2px 4px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;margin:2px 0 14px}
.tabs button{border:0;background:none;border-radius:11px;min-height:40px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap;font-size:14px;padding:0 4px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.t-dark .tabs button[aria-selected=true]{background:var(--primary-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;cursor:pointer;min-height:38px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.monthsel{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 6px}
.monthsel b{font:800 17px Nunito,sans-serif}
.sum .amt.big{font-size:32px;display:block;line-height:1.15}
.catbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 10px;gap:2px}
.catbar i{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
/* Cuentas */
.dist{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:3px;margin:14px 0 12px}
.dist i{height:100%;border-radius:3px}
.acc{width:100%;border:0;text-align:left;cursor:pointer;color:var(--ink);display:block;margin-bottom:10px}
.acc .h{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.acc .amt{font-size:19px}
.acc ul{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:14px}
.acc li{display:flex;justify-content:space-between;padding:4px 0;gap:10px}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn.p{background:var(--primary);color:var(--on-primary)}.btn.s{background:var(--primary-soft);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--ink2);margin:10px 2px 0}
/* Estadísticas */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.t-dark .kpis div{box-shadow:none;border:1px solid var(--line)}
.kpis small{display:block;font-size:12px;color:var(--ink2)}.kpis .amt{font-size:16px}
.donut{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.donut svg{width:132px;height:132px}
.lg{list-style:none;margin:0;padding:0;font-size:13px}
.lg li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:4px 0}
.lg li b{font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars .g{flex:1;display:flex;gap:4px;align-items:flex-end;height:100%;justify-content:center}
.bars i{width:min(22px,40%);border-radius:7px 7px 2px 2px;display:block;min-height:2px}
.bx{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}.bx span{flex:1;text-align:center}
.spark{width:100%;height:120px;display:block}
.acct{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.acct:last-child{border-bottom:0}
.acct .t{font-weight:600;display:flex;align-items:center;gap:8px}
.acct .meter{grid-column:1/-1;margin-top:8px;height:8px}
.note2{display:flex;gap:8px;font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:14px;padding:10px 12px;margin-top:12px}
/* Más y compromisos */
.menu .row{padding:12px 0}
.soon{font-size:12px;color:var(--ink2)}
/* Navegación inferior */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 18px;z-index:5}
.nav button{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:14px}
.nav button[aria-current=page]{color:var(--primary)}
.nav button[aria-current=page] .ic{stroke-width:2.3}
.nav .reg i{width:54px;height:54px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(91,42,134,.35);border:4px solid var(--nav)}
.nav .reg{color:var(--ink)}
/* Hojas inferiores */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:28px 28px 0 0;z-index:11;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.t-dark .sheet{background:#2B2238}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sh{display:flex;align-items:center;padding:6px 10px 2px 20px}.sh h3{font:800 20px Nunito,sans-serif;margin:0;flex:1}
.sb{overflow-y:auto;padding:6px 20px 16px}
.sf{padding:12px 20px 22px;border-top:1px solid var(--line);flex:none}
@keyframes up{from{transform:translateY(40%);opacity:.3}}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast{animation:none}}
.opt{display:grid;grid-template-columns:48px 1fr 20px;gap:14px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;margin-bottom:10px;text-align:left;cursor:pointer;color:var(--ink)}
.t-dark .opt{background:var(--sunk)}
.opt i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--ink2)}
.money{display:grid;justify-items:center;padding:6px 0 4px}
.money label{font-size:13px;color:var(--ink2);font-weight:600}
.money .inp{display:flex;align-items:baseline;gap:4px;font:800 40px Nunito,sans-serif;color:var(--ink)}
.money input{font:inherit;color:inherit;border:0;background:none;max-width:260px;text-align:left;padding:0;outline:none;font-variant-numeric:tabular-nums}
.money .line{width:220px;height:2px;background:var(--line);border-radius:2px;margin-top:2px}
.money:focus-within .line{background:var(--primary)}
.fl{display:block;font-size:14px;font-weight:600;margin:16px 0 8px}
.field{width:100%;border:1.5px solid var(--field);border-radius:14px;background:var(--surface);color:var(--ink);font:16px Inter,sans-serif;padding:12px 14px;min-height:50px}
.t-dark .field{background:var(--sunk)}
.field:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.err{color:var(--neg);font-size:13px;margin:6px 2px 0;display:flex;gap:6px;align-items:center}
.picker{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.pk{flex:none;width:122px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.t-dark .pk{background:var(--sunk)}
.pk[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);background:var(--primary-soft)}
.pk small{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}.pk .amt{font-size:15px;display:block;margin-top:2px}
.preview{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pos-soft);color:var(--pos);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:14px;font-weight:600}
.preview.bad{background:var(--neg-soft);color:var(--neg)}
.preview .amt{font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dest{display:grid;grid-template-columns:1fr 128px 36px;gap:8px;align-items:center;margin-bottom:8px}
.left{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;margin-top:6px}
.left.ok{background:var(--pos-soft);color:var(--pos)}
.tlist{list-style:none;margin:8px 0 0;padding:0}
.tlist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.toast{position:absolute;left:14px;right:14px;bottom:96px;z-index:20;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 14px 8px 8px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;animation:up .25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast .cat::before{background:var(--plate)!important;content:""}
/* Bienvenida y cuentas iniciales */
.t-light{--halo:#FBE3C6}.t-dark{--halo:#F6EADB}
.onbwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.onb{flex:1;overflow-y:auto;padding:4px 20px 20px}
.onb-top{display:flex;justify-content:space-between;align-items:center;min-height:48px;margin-bottom:4px}
.brand{font:800 18px Nunito,sans-serif;color:var(--primary);display:flex;align-items:center;gap:6px}
.step{font-size:13px;font-weight:600;color:var(--ink2);background:var(--sunk);border-radius:99px;padding:5px 11px}
.onb-hero{position:relative;height:240px;display:grid;place-items:center;margin:6px 0 10px}
.onb-hero::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:var(--halo)}
.onb-hero .cat::before{display:none}
.blob{position:absolute;border-radius:50%;display:block}
.b1{width:30px;height:30px;background:var(--orange);left:16%;top:18%}.b2{width:16px;height:16px;background:var(--yellow);right:18%;top:12%}
.b3{width:22px;height:22px;border:4px solid var(--c4);right:12%;bottom:20%}.b4{width:12px;height:12px;background:var(--c4);left:12%;bottom:24%}
.onb-h{font:800 25px/1.2 Nunito,sans-serif;margin:0 0 6px;text-wrap:balance}
.onb-p{margin:0 0 14px;color:var(--ink2)}
.onb-foot{padding:12px 20px 28px;border-top:1px solid var(--line);background:var(--bg);flex:none}
.onb-foot .hint{text-align:center;margin-top:8px}
.onb-head{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;min-height:56px;cursor:pointer;font-weight:600;text-align:left;color:var(--ink)}
.tile .bub{width:34px;height:34px;border-radius:11px;flex:none}
.tile .tn{flex:1;overflow-wrap:anywhere;line-height:1.25}
@container (max-width:370px){.tile .bub{display:none}.tile{padding:10px;gap:8px;font-size:14px}}
.tile[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft)}
.ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--field);display:grid;place-items:center;flex:none;color:transparent}
.tile[aria-pressed=true] .ck{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.o{background:none;border:1.5px dashed var(--field);color:var(--primary);margin-top:12px;min-height:50px;font-size:15px}
.selrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.selrow:last-child{border-bottom:0}
.selrow .bub{width:36px;height:36px;border-radius:12px}
.count{font-size:12px;color:var(--ink2);text-align:right;margin-top:4px}
.empty{text-align:center;padding:24px 10px 10px;display:grid;justify-items:center;gap:6px}
.empty b{font:800 18px Nunito,sans-serif}.empty p{margin:0 0 10px;color:var(--ink2);max-width:30ch}
.empty .btn{width:auto}

/* ===== Etapa 4: componentes nuevos ===== */
.jumps{display:grid;gap:8px;margin-bottom:22px}
.jump .jl{font:700 12px Inter;color:var(--page-ink2);text-transform:uppercase;letter-spacing:.6px;align-self:center;min-width:86px}
.lead{color:var(--ink2);margin:0 2px 12px;font-size:14px}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:6px 0 2px}
.vals small{display:block;font-size:12px;color:var(--ink2)}.vals .amt{font-size:17px}
.prog.big{height:10px;margin-top:12px}
.cupo{margin-top:12px}.cupo-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.cupo-bar .u{background:var(--orange)}.cupo-bar .a{background:var(--pos);opacity:.85}
.cupo-l{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2);margin-top:8px}
.cupo-l span{display:inline-flex;align-items:center;gap:6px}.cupo-l b{color:var(--ink);font-size:14px}
.subc,.planc,.debtc{margin-bottom:12px}
.subc.off{opacity:.75}
.h3{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.h3 b{display:block;font-weight:700;font-size:16px}.h3 .mut{font-size:13px;display:block}
.subn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 2px;font-size:14px;color:var(--ink2)}
.subn b{color:var(--ink);font-weight:600}
.row2{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row2 .btn{width:auto;flex:1}.row2 .ib{margin-left:auto}
.btn.sm{min-height:44px;font-size:14px;padding:0 14px;border-radius:14px}
.btn.d{background:var(--neg);color:#fff}.t-dark .btn.d{color:#1C1625}
.btn.dd{background:none;border:1.5px solid var(--neg);color:var(--neg);min-height:48px;font-size:15px}
.tag.ok{background:var(--pos-soft);color:var(--pos)}.tag.warn2{background:var(--warn-soft);color:var(--warn)}
.cnt{display:inline-block;min-width:20px;font-size:12px;background:var(--sunk);border-radius:99px;padding:0 6px;margin-left:4px}
.tabs button[aria-selected=true] .cnt{background:var(--primary-soft)}
.reco{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:8px 12px;margin:10px 0 0}
.reco b{font-size:14px}
.warnline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:12px;padding:8px 12px;margin:10px 0 0}
.filter{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--primary-soft);color:var(--primary);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:12px;font-size:14px}
.filter span{display:flex;gap:8px;align-items:center}.filter .link{margin:0;padding:10px 8px}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}.prow b{display:block;font-weight:600}.prow .mut{display:block;font-size:13px}.prow .prog{margin-top:6px}
.bigamt{text-align:center;padding:6px 0 4px}.bigamt small{display:block;color:var(--ink2);font-size:13px;font-weight:600}.bigamt .amt{font-size:36px}
.opts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}.opts3 .pk{width:auto}
.inl-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}.inl-add .btn{width:auto}
.link.inl{display:inline;margin:0;padding:0;font-size:inherit;text-decoration:underline}
.saving{width:100%;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.due{width:100%;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.entc .cupo{margin-top:12px}
.mo{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--ink);font:500 16px Inter,sans-serif;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;min-height:52px}
.mo:last-child{border-bottom:0}.mo.danger{color:var(--neg)}
.dlg{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);z-index:31;background:var(--surface);border-radius:24px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:fade .2s;text-align:center}
.t-dark .dlg{background:#2B2238}
.dlg h3{font:800 19px/1.25 Nunito,sans-serif;margin:6px 0 8px}.dlg p{margin:0 0 18px;color:var(--ink2);font-size:14px}
.dlg-ic{width:48px;height:48px;border-radius:16px;display:inline-grid;place-items:center;background:var(--primary-soft);color:var(--primary)}.dlg-ic.neg{background:var(--neg-soft);color:var(--neg)}
.dlg-a{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dlg-a .btn:only-child{grid-column:1/-1}
.dlg-a .btn{min-height:48px;font-size:15px;padding:0 10px}
.skel{height:84px;border-radius:20px;background:linear-gradient(90deg,var(--sunk) 0 40%,var(--surface) 50%,var(--sunk) 60% 100%);background-size:300% 100%;animation:shim 1.4s linear infinite;margin-bottom:12px}
.skel.h{height:168px;border-radius:24px}.skel.s{height:52px}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
.setsec{margin-bottom:14px}.setsec h3{font:800 17px Nunito,sans-serif;margin:0 0 4px}.setsec>.mut{font-size:13px;margin:0 0 10px;display:block}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}.srow .bub{width:40px;height:40px;border-radius:12px}.srow b{display:block;font-weight:600}.srow .mut{font-size:12px;display:block}
.srow .acts{display:flex}.srow .acts .ib{width:40px;height:40px}
.ib:disabled{opacity:.35;cursor:not-allowed}
.loanc{margin-bottom:12px}
.sbal{background:var(--hero);color:var(--on-hero);border-radius:24px;padding:18px;position:relative}
.sbal small{color:var(--on-hero2);font-size:14px}.sbal .amt{font-size:34px;display:block;margin:2px 0 4px}.sbal p{margin:0 0 14px;color:var(--on-hero2);font-size:14px;padding-right:90px}
.sbal .cat{position:absolute;right:8px;top:6px}
.sbal .row2 .btn.s{background:rgba(255,248,239,.14);color:var(--on-hero)}
.sbal .row2 .btn.p{background:var(--on-hero);color:var(--hero)}
.disabledrow{opacity:.6}
.amt.warn,.vals .warn{color:var(--warn)}
.sbal .row2 .btn:disabled{opacity:.5}
</style>

/* ======================= Reductor ======================= */
function reducer(s,a){
  if(a.t==='reset'){ACC=ACC0.map(x=>({...x}));return a.empty?EMPTY():SEED();}
  const bal={...s.bal}; const up=(k,id,f)=>s[k].map(x=>x.id===id?f(x):x); const exp=(e)=>[e,...s.expenses].sort((x,y)=>y.date.localeCompare(x.date));
  switch(a.t){
    case 'expense':{ if(a.old)bal[a.old.acc]+=a.old.amount; bal[a.e.acc]-=a.e.amount;
      const ex=a.old?s.expenses.map(x=>x.id===a.old.id?a.e:x):[a.e,...s.expenses]; return {...s,bal,expenses:ex.sort((x,y)=>y.date.localeCompare(x.date))}; }
    case 'delExpense':bal[a.e.acc]+=a.e.amount;return {...s,bal,expenses:s.expenses.filter(x=>x.id!==a.e.id)};
    case 'transfer':{ if(a.old){bal[a.old.from]+=a.old.amount;bal[a.old.to]-=a.old.amount;} bal[a.tr.from]-=a.tr.amount;bal[a.tr.to]+=a.tr.amount;
      return {...s,bal,transfers:a.old?s.transfers.map(x=>x.id===a.old.id?a.tr:x):[a.tr,...s.transfers]}; }
    case 'revertTransfer':bal[a.tr.from]+=a.tr.amount;bal[a.tr.to]-=a.tr.amount;return {...s,bal,transfers:s.transfers.filter(x=>x.id!==a.tr.id)};
    case 'income':{ if(a.old)a.old.dest.forEach(([acc,v])=>bal[acc]-=v); a.i.dest.forEach(([acc,v])=>bal[acc]+=v);
      const inc=(a.old?s.incomes.map(x=>x.id===a.old.id?a.i:x):[a.i,...s.incomes]).sort((x,y)=>y.date.localeCompare(x.date));
      return {...s,bal,incomes:inc,debts:a.debt?[a.debt,...s.debts]:s.debts}; }
    case 'delIncome':a.i.dest.forEach(([acc,v])=>bal[acc]-=v);return {...s,bal,incomes:s.incomes.filter(x=>x.id!==a.i.id)};
    /* Suscripciones */
    case 'sub':return {...s,subs:a.old?up('subs',a.x.id,()=>a.x):[...s.subs,a.x]};
    case 'paySub':{const x=s.subs.find(y=>y.id===a.id);bal[a.acc]-=x.price;const step={Semanal:[7,0],Mensual:[0,1],Trimestral:[0,3],Anual:[0,12]}[x.freq];
      const next=step[0]?addDays(x.next,step[0]):addMonths(x.next,step[1],x.day);
      return {...s,bal,expenses:exp(E(TODAY,x.name,'Suscripción',a.acc,x.price,null,x.id)),subs:up('subs',a.id,y=>({...y,next,pays:[{date:TODAY,amount:y.price,acc:a.acc},...y.pays]}))};}
    case 'subActive':return {...s,subs:up('subs',a.id,y=>({...y,active:a.on,next:a.on&&y.next<TODAY?addMonths(TODAY,0,y.day)<TODAY?addMonths(TODAY,1,y.day):addMonths(TODAY,0,y.day):y.next}))};
    /* Gastos futuros */
    case 'plan':return {...s,plans:a.old?up('plans',a.x.id,()=>a.x):[a.x,...s.plans],cats:a.newCat&&!s.cats.includes(a.newCat)?[...s.cats.slice(0,-1),a.newCat,s.cats[s.cats.length-1]]:s.cats};
    case 'reserve':bal[a.acc]-=a.v;return {...s,bal,plans:up('plans',a.id,p=>({...p,reserved:p.reserved+a.v,resAcc:a.acc}))};
    case 'release':{const p=s.plans.find(x=>x.id===a.id);bal[a.acc]+=p.reserved;return {...s,bal,plans:up('plans',a.id,x=>({...x,reserved:0,resAcc:null}))};}
    case 'planStatus':return {...s,plans:up('plans',a.id,p=>({...p,status:a.st}))};
    case 'delPlan':return {...s,plans:s.plans.filter(p=>p.id!==a.id)};
    case 'addCat':return {...s,cats:[...s.cats.slice(0,-1),a.c,s.cats[s.cats.length-1]]};
    /* Deudas */
    case 'debt':return {...s,debts:[a.x,...s.debts]};
    case 'payDebt':{const x=s.debts.find(y=>y.id===a.id);bal[a.acc]-=a.v;const paid=x.paid+a.v,done=paid>=x.orig;
      const q=done?x.n:Math.min(x.n,x.paidQ+(a.opt==='cuota'||a.v>=x.quota?Math.max(1,Math.floor(a.v/x.quota)):0));
      const e=E(a.date,x.entity?'Abono '+x.name.split(' · ')[0]:'Abono '+x.name.charAt(0).toLowerCase()+x.name.slice(1),'Pago de deuda',a.acc,a.v,`${x.entity?'Crédito de compra':'Deuda'} · ${a.opt==='todo'||done?'pago total':`cuota ${Math.min(q,x.n)} de ${x.n}`}`,x.id);
      return {...s,bal,expenses:exp(e),debts:up('debts',a.id,y=>({...y,paid,paidQ:q,next:done?null:addMonths(y.next||TODAY,1,y.day),pays:[{date:a.date,amount:a.v,acc:a.acc},...y.pays]}))};}
    case 'delDebt':return {...s,debts:s.debts.filter(x=>x.id!==a.id)};
    /* Créditos */
    case 'entity':return {...s,entities:[...s.entities,a.x]};
    case 'limit':return {...s,entities:up('entities',a.id,e=>({...e,limit:a.v,hist:[{date:TODAY,from:e.limit,to:a.v},...e.hist]}))};
    case 'retire':return {...s,entities:up('entities',a.id,e=>({...e,retired:true}))};
    /* Ahorros y préstamos */
    case 'saving':{const k=a.type==='Aporte'?1:-1;bal[a.acc]-=k*a.v;return {...s,bal,savings:s.savings+k*a.v,smoves:[{id:uid(),date:a.date,type:a.type,amount:a.v,acc:a.acc},...s.smoves]};}
    case 'loan':bal[a.x.acc]-=a.x.amount;return {...s,bal,loans:[a.x,...s.loans]};
    case 'loanRet':bal[a.acc]+=a.v;return {...s,bal,loans:up('loans',a.id,l=>({...l,returned:l.returned+a.v,rets:[{date:a.date,amount:a.v,acc:a.acc},...l.rets]}))};
    /* Configuración */
    case 'renameCat':return {...s,cats:s.cats.map(c=>c===a.from?a.to:c),expenses:s.expenses.map(e=>e.cat===a.from?{...e,cat:a.to}:e),plans:s.plans.map(p=>p.cat===a.from?{...p,cat:a.to}:p)};
    case 'delCat':return {...s,cats:s.cats.filter(c=>c!==a.c)};
    case 'acc':{ if(a.id){ACC=ACC.map(x=>x.id===a.id?{...x,name:a.name}:x);return {...s};}
      const id='acc'+uid();ACC=[...ACC,{id,name:a.name,kind:'digital',color:'var(--c6)',icon:'wallet'}];return {...s,bal:{...bal,[id]:0}}; }
    case 'delAcc':{ACC=ACC.filter(x=>x.id!==a.id);delete bal[a.id];return {...s,bal};}
    case 'wipe':return {...EMPTY(),cats:s.cats,bal:Object.fromEntries(Object.keys(s.bal).map(k=>[k,0]))};
  } return s;
}

const MenuSheet=({m,close})=>html`<${Sheet} title=${m.title} onClose=${close}>${m.items.map(([ic,t,fn,danger])=>html`<button key=${t} class=${'mo'+(danger?' danger':'')} onClick=${()=>{close();fn()}}><${I} n=${ic} s=${20}/>${t}</button>`)}<//>`;
const Empty=({cat='vacio',title,text,action,onAction})=>html`<div class="empty"><${Cat} k=${cat} size="M"/><b>${title}</b><p>${text}</p>${action&&html`<button class="btn s" onClick=${onAction}>${action}</button>`}</div>`;
const Tag=({kind='soft',icon,children})=>html`<span class=${'tag '+kind}>${icon&&html`<${I} n=${icon} s=${13}/>`}${children}</span>`;
const Vals=({items})=>html`<div class="vals">${items.map(([l,v,c])=>html`<div key=${l}><small>${l}</small><span class=${'amt '+(c||'')}>${v}</span></div>`)}</div>`;
const Bar=({value,total,color='var(--primary)',label})=>html`<div class="prog big" role="img" aria-label=${label||`${pct(value,total)} %`}><i style=${{width:Math.min(100,pct(value,total))+'%',background:color}}></i></div>`;
/* Cupo: utilizado + disponible */
const Cupo=({used,limit})=>{const u=Math.min(used,limit),av=Math.max(0,limit-used);return html`<div class="cupo" role="img" aria-label=${`Cupo utilizado ${fmt(u)} de ${fmt(limit)}; disponible ${fmt(av)}`}>
  <div class="cupo-bar"><i class="u" style=${{width:pct(u,limit)+'%'}}></i><i class="a" style=${{width:pct(av,limit)+'%'}}></i></div>
  <div class="cupo-l"><span><i class="dot" style=${{background:'var(--orange)'}}></i>Utilizado <b class="amt">${fmt(u)}</b></span><span><i class="dot" style=${{background:'var(--pos)'}}></i>Disponible <b class="amt">${fmt(av)}</b></span></div></div>`};
const SecHead=({title,children})=>html`<div class="sec"><h3>${title}</h3>${children}</div>`;
const ExpenseRow=({e,onOpen})=>{const [ic]=catInfo(e.cat);const a=accOf(e.acc);
  return html`<button class=${'row'+(e.debt?' debt':'')} onClick=${()=>onOpen(e)} aria-label=${`${e.name}, ${fmt(e.amount)}${e.debt?', abono de deuda, solo lectura':''}`}>
   <span class="bub">${e.debt?html`<${I} n="lock" s=${20}/>`:html`<${I} n=${ic} s=${20}/>`}</span>
   <span><span class="t" style=${{display:'block'}}>${e.name}</span><span class="s" style=${{display:'block'}}>${e.debt?e.debt:e.cat} · ${a.name}</span></span>
   <span class="right"><span class="amt neg">−${fmt(e.amount)}</span>${e.debt&&html`<span class="tag lock">Solo lectura</span>`}</span></button>`};
const IncomeRow=({i,onOpen})=>html`<button class="row" onClick=${onOpen?()=>onOpen(i):undefined} style=${onOpen?null:{cursor:'default'}} aria-label=${`${i.type}, ${fmt(i.amount)}`}><span class="bub" style=${{background:'var(--pos-soft)',color:'var(--pos)'}}><${I} n="in" s=${20}/></span>
  <span><span class="t" style=${{display:'block'}}>${i.type}</span><span class="s" style=${{display:'block'}}>${i.dest.map(([a])=>accOf(a).name).join(', ')}</span></span><span class="amt pos">+${fmt(i.amount)}</span></button>`;
const TransferRow=({t,onOpen})=>html`<button class="row" onClick=${onOpen?()=>onOpen(t):undefined} style=${onOpen?null:{cursor:'default'}}><span class="bub" style=${{background:'var(--primary-soft)',color:'var(--primary)'}}><${I} n="swap" s=${20}/></span>
  <span><span class="t" style=${{display:'block'}}>Transferencia</span><span class="s" style=${{display:'block'}}>${accOf(t.from).name} → ${accOf(t.to).name} · ${dayLabel(t.date)}</span></span><span class="amt">${fmt(t.amount)}</span></button>`;
const Due=({x,onOpen})=>{const n=days(TODAY,x.date);const dd=d(x.date);
  return html`<button class="due" onClick=${onOpen} aria-label=${`${x.name}, ${fmt(x.amount)}, ${dueLabel(x.date)}`}><span class="date" aria-hidden="true"><b>${dd.getDate()}</b><span>${MES[dd.getMonth()]}</span></span>
   <span><span class="t" style=${{display:'block'}}>${x.name}</span><span class="s" style=${{display:'block'}}>${x.sub}</span>
   ${x.reserved!=null&&html`<div class="prog" role="img" aria-label=${`Reservado ${pct(x.reserved,x.amount)} %`}><i style=${{width:pct(x.reserved,x.amount)+'%'}}></i></div>`}</span>
   <span class="right"><span class="amt">${fmt(x.amount)}</span><span class=${'tag '+(n<=7?'warn':'soft')}>${n<=7?html`<${I} n="alert" s=${13}/>`:''}${dueLabel(x.date)}</span></span></button>`};
const Note=({icon='info',children})=>html`<p class="note2"><${I} n=${icon} s=${18}/><span>${children}</span></p>`;

/* ======================= Pantallas principales ======================= */
function Inicio({s,ui,go,open}){
  const [openAcc,setOpenAcc]=useState(false);
  const total=totalBal(s), dig=total-s.bal.efectivo, r=RANGES.mes;
  const inc=sum(s.incomes.filter(i=>inR(i.date,r)),i=>i.amount), exp=sum(s.expenses.filter(e=>inR(e.date,r)),e=>e.amount);
  const recent=[...s.expenses.map(e=>({...e,k:'e'})),...s.incomes.map(i=>({...i,k:'i'})),...s.transfers.map(t=>({...t,k:'t'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  const p=pct(exp,inc), due=upcoming(s);
  return html`<div>
   <p class="hello">Hola, <b>${ui.userName}</b>. Así va tu dinero hoy.</p>
   <section class="hero" aria-label="Dinero disponible">
    <${Cat} k="inicio" size="M" plate/>
    <small>Dinero disponible</small><span class="amt big">${fmt(total)}</span>
    <div class="split">
     <button onClick=${()=>go('cuentas')}><small><i class="dot" style=${{background:'var(--yellow)'}}></i>Efectivo</small><span class="amt">${fmt(s.bal.efectivo)}</span></button>
     <button aria-expanded=${openAcc} onClick=${()=>setOpenAcc(!openAcc)}><small><i class="dot" style=${{background:'#C9A7F0'}}></i>Digital <${I} n=${openAcc?'chevd':'chev'} s=${16}/></small><span class="amt">${fmt(dig)}</span></button>
    </div>
    ${openAcc&&html`<ul class="acclist">${ACC.filter(a=>a.kind==='digital').map(a=>html`<li key=${a.id}><span><${I} n=${a.icon} s=${18}/>${a.name}</span><span class="amt">${fmt(s.bal[a.id]||0)}</span></li>`)}</ul>`}
    <button class="more" onClick=${()=>go('cuentas')}>Ver cuentas y transferencias <${I} n="chev" s=${18}/></button>
   </section>
   <div class="quick">
    <button class="qa in" onClick=${()=>open('income')}><i><${I} n="in"/></i>Agregar ingreso</button>
    <button class="qa out" onClick=${()=>open('expense')}><i><${I} n="out"/></i>Registrar gasto</button>
    <button class="qa tr" onClick=${()=>open('transfer')}><i><${I} n="swap"/></i>Transferir</button>
   </div>
   <${SecHead} title=${MESL[10]+' 2026'}><button class="link" onClick=${()=>go('stats')}>Estadísticas <${I} n="chev" s=${16}/></button><//>
   <div class="card">
    <div class="month"><div class="metric"><small>Ingresos del mes</small><span class="amt pos">${fmt(inc)}</span></div><div class="metric"><small>Gastos del mes</small><span class="amt neg">${fmt(exp)}</span></div></div>
    <div class="meter" style=${{marginTop:'14px'}} role="img" aria-label=${`Has gastado el ${p} % de tus ingresos`}><i style=${{width:Math.min(p,100)+'%',background:'var(--neg)'}}></i></div>
    <p class="caption">${inc?`Has gastado el ${p} % de lo que recibiste este mes.`:'Aún no registras ingresos este mes.'}</p>
    <button class="saving" onClick=${()=>go('savings')}><span style=${{display:'flex',gap:'8px',alignItems:'center'}}><${I} n="piggy" s=${20}/>Ahorro acumulado</span><span class="amt">${fmt(s.savings)}</span></button>
   </div>
   <${SecHead} title="Próximos pagos">${due.length>0&&html`<button class="link" onClick=${()=>go('comp')}>Ver todos <${I} n="chev" s=${16}/></button>`}<//>
   <div class="card">${due.length?due.slice(0,4).map(x=>html`<${Due} x=${x} key=${x.key} onOpen=${()=>go(x.to)}/>`):html`<${Empty} title="Nada pendiente" text="No tienes pagos o planes próximos."/>`}</div>
   <${SecHead} title="Movimientos recientes">${recent.length>0&&html`<button class="link" onClick=${()=>go('mov')}>Ver todos <${I} n="chev" s=${16}/></button>`}<//>
   <div class="card" style=${{paddingBlock:'6px'}}>${recent.length?recent.map(m=>m.k==='e'?html`<${ExpenseRow} e=${m} key=${m.id} onOpen=${x=>open(x.debt?'debtinfo':'expense',x)}/>`:m.k==='i'?html`<${IncomeRow} i=${m} key=${m.id}/>`:html`<${TransferRow} t=${m} key=${m.id}/>`)
     :html`<${Empty} title="Sin movimientos" text="Cuando registres un ingreso o un gasto, aparecerá aquí."/>`}</div>
   ${inc>0&&html`<${Note} icon="bulb">Consejo: aparta el ahorro apenas recibas el sueldo; lo que queda es lo que puedes gastar.<//>`}
  </div>`;
}

function Movimientos({s,ui,set,open,menu,confirm,dispatch,toast}){
  const tab=ui.movTab, month=ui.month, r=month==='nov'?RANGES.mes:RANGES.ant;
  const list=s.expenses.filter(e=>inR(e.date,r)), total=sum(list,e=>e.amount);
  const incs=s.incomes.filter(i=>inR(i.date,r)), inc=sum(incs,i=>i.amount);
  const byCat=Object.entries(list.reduce((m,e)=>(m[e.cat]=(m[e.cat]||0)+e.amount,m),{})).sort((a,b)=>b[1]-a[1]);
  const shown=list.filter(e=>!ui.cat||e.cat===ui.cat);
  const groups=shown.reduce((m,e)=>((m[e.date]=m[e.date]||[]).push(e),m),{});
  const igroups=incs.reduce((m,e)=>((m[e.date]=m[e.date]||[]).push(e),m),{});
  const incMenu=i=>menu({title:`${i.type} · ${fmt(i.amount)}`,items:[['pencil','Editar ingreso',()=>open('income',i)],['trash','Eliminar ingreso',()=>confirm({title:'¿Eliminar este ingreso?',body:`Se descontarán ${fmt(i.amount)} de ${i.dest.map(([a])=>accOf(a).name).join(', ')}. No podrás deshacerlo.`,ok:'Eliminar',danger:true,icon:'trash',action:()=>{dispatch({t:'delIncome',i});toast('Ingreso eliminado.')}}),true]]});
  const byType=['Sueldo','Dinero extra','Préstamo recibido'].map(t=>[t,sum(incs.filter(i=>i.type===t),i=>i.amount)]).filter(x=>x[1]);
  return html`<div>
   <div class="tabs" role="tablist" aria-label="Tipo de movimiento">${[['gastos','Gastos'],['ingresos','Ingresos']].map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} onClick=${()=>set({movTab:k})}>${l}</button>`)}</div>
   <div class="monthsel"><button class="ib" aria-label="Mes anterior" disabled=${month==='oct'} onClick=${()=>set({month:'oct',cat:null})}><${I} n="back"/></button><b>${month==='nov'?'Noviembre':'Octubre'} 2026</b><button class="ib" aria-label="Mes siguiente" disabled=${month==='nov'} onClick=${()=>set({month:'nov',cat:null})}><${I} n="chev"/></button></div>
   ${tab==='gastos'?html`<div>
    <div class="card sum"><small class="mut">Total gastado</small><span class="amt big neg">${fmt(total)}</span>
     <span class="mut" style=${{fontSize:'13px'}}>${list.length} movimientos${inc?` · ${pct(total,inc)} % de tus ingresos`:''}</span>
     ${total>0&&html`<div class="catbar" role="img" aria-label="Gastos por categoría">${byCat.map(([c,v])=>html`<i key=${c} style=${{width:pct(v,total)+'%',background:catInfo(c)[1]}}></i>`)}</div>
     <div class="leg">${byCat.slice(0,4).map(([c,v])=>html`<span key=${c}><i class="dot" style=${{background:catInfo(c)[1]}}></i>${c} ${fmt(v)}</span>`)}</div>`}
    </div>
    ${list.length>0&&html`<div class="chips" role="group" aria-label="Filtrar por categoría" style=${{marginTop:'14px'}}>
     <button class="chip" aria-pressed=${!ui.cat} onClick=${()=>set({cat:null})}>Todas</button>
     ${byCat.map(([c])=>html`<button key=${c} class="chip" aria-pressed=${ui.cat===c} onClick=${()=>set({cat:c})}><${I} n=${catInfo(c)[0]} s=${16}/>${c}</button>`)}</div>`}
    ${list.length?Object.entries(groups).map(([day,es])=>html`<div key=${day}><p class="day">${dayLabel(day)}</p><div class="card" style=${{paddingBlock:'4px'}}>${es.map(e=>html`<${ExpenseRow} e=${e} key=${e.id} onOpen=${x=>open(x.debt?'debtinfo':'expense',x)}/>`)}</div></div>`)
     :html`<div class="card" style=${{marginTop:'14px'}}><${Empty} title="Todavía no hay gastos por aquí" text="Registra tu primer gasto y aquí verás en qué se va tu dinero." action="Registrar gasto" onAction=${()=>open('expense')}/></div>`}
    ${list.some(e=>e.debt)&&html`<${Note} icon="lock">Los abonos de deudas aparecen aquí porque restan de tu dinero, pero se editan desde Compromisos › Deudas.<//>`}
   </div>`:html`<div>
    <div class="card sum"><small class="mut">Total recibido</small><span class="amt big pos">${fmt(inc)}</span>
     ${byType.length>0&&html`<div class="leg" style=${{marginTop:'8px'}}>${byType.map(([t,v])=>html`<span key=${t}>${t} ${fmt(v)}</span>`)}</div>`}
     <button class="btn s" style=${{marginTop:'14px'}} onClick=${()=>open('income')}><${I} n="plus" s=${18}/>Agregar ingreso</button></div>
    ${incs.length?Object.entries(igroups).map(([day,is])=>html`<div key=${day}><p class="day">${dayLabel(day)}</p><div class="card" style=${{paddingBlock:'4px'}}>${is.map(i=>html`<${IncomeRow} i=${i} key=${i.id} onOpen=${incMenu}/>`)}</div></div>`)
     :html`<div class="card" style=${{marginTop:'14px'}}><${Empty} cat="vacio" title="Sin ingresos este mes" text="Cuando recibas dinero, regístralo y repártelo entre efectivo y tus cuentas." action="Agregar ingreso" onAction=${()=>open('income')}/></div>`}
    ${incs.some(i=>i.type==='Préstamo recibido')&&html`<${Note}>Los préstamos recibidos también aparecen en Deudas y no cuentan como dinero ganado.<//>`}
   </div>`}
  </div>`;
}

function Cuentas({s,ui,set,open,go}){
  const total=totalBal(s), dig=total-s.bal.efectivo;
  const spent=id=>sum(s.expenses.filter(e=>e.acc===id&&inR(e.date,RANGES.mes)),e=>e.amount);
  const AccCard=({a})=>{const o=ui.acc===a.id;const last=[...s.expenses.filter(e=>e.acc===a.id).map(e=>[e.date,e.name,-e.amount]),...s.incomes.flatMap(i=>i.dest.filter(([x])=>x===a.id).map(([,v])=>[i.date,i.type,v])),
      ...s.transfers.filter(t=>t.from===a.id||t.to===a.id).map(t=>[t.date,t.from===a.id?'Transferencia a '+accOf(t.to).name:'Transferencia de '+accOf(t.from).name,t.from===a.id?-t.amount:t.amount])].sort((x,y)=>y[0].localeCompare(x[0])).slice(0,3);
    return html`<button class="card acc" aria-expanded=${o} onClick=${()=>set({acc:o?null:a.id})}>
     <div class="h"><span class="bub" style=${{background:'var(--sunk)',color:a.color}}><${I} n=${a.icon} s=${20}/></span>
      <span><b style=${{display:'block'}}>${a.name}</b><span class="mut" style=${{fontSize:'13px',display:'block'}}>${pct(s.bal[a.id]||0,total)} % del total</span><span class="mut" style=${{fontSize:'13px',display:'block'}}>Salió <span class="nw">${fmt(spent(a.id))}</span> este mes</span></span>
      <span class="amt">${fmt(s.bal[a.id]||0)}</span></div>
     ${o&&html`<ul>${last.length?last.map(([dt,n,v],k)=>html`<li key=${k}><span>${dayLabel(dt)} · ${n}</span><span class=${'amt '+(v<0?'neg':'pos')}>${v<0?'−':'+'}${fmt(v)}</span></li>`):html`<li><span class="mut">Sin movimientos todavía.</span></li>`}</ul>`}
    </button>`};
  return html`<div>
   <div class="card"><small class="mut">Total de tu dinero</small><span class="amt" style=${{fontSize:'34px',display:'block',lineHeight:1.15}}>${fmt(total)}</span>
    <div class="dist" role="img" aria-label="Distribución del dinero por cuenta">${total>0&&ACC.map(a=>html`<i key=${a.id} style=${{width:pct(s.bal[a.id]||0,total)+'%',background:a.color}}></i>`)}</div>
    <div class="leg">${ACC.map(a=>html`<span key=${a.id}><i class="dot" style=${{background:a.color}}></i>${a.name} ${pct(s.bal[a.id]||0,total)} %</span>`)}</div>
    <div style=${{marginTop:'16px'}}><button class="btn p" onClick=${()=>open('transfer')}><${I} n="swap"/>Transferir entre cuentas</button></div>
   </div>
   <${SecHead} title="Efectivo"><span class="amt mut">${fmt(s.bal.efectivo)}</span><//>
   <${AccCard} a=${ACC[0]}/>
   <${SecHead} title="Digital"><span class="amt mut">${fmt(dig)}</span><//>
   ${ACC.slice(1).map(a=>html`<${AccCard} a=${a} key=${a.id}/>`)}
   <${SecHead} title="Transferencias recientes"><//>
   <div class="card" style=${{paddingBlock:'4px'}}>${s.transfers.length?s.transfers.slice(0,3).map(t=>html`<${TransferRow} t=${t} key=${t.id}/>`):html`<p class="mut" style=${{margin:'12px 0'}}>Todavía no has movido dinero entre tus cuentas.</p>`}</div>
   <p class="hint">Las transferencias no cuentan como ingreso ni gasto. Para editarlas o revertirlas, y para agregar o renombrar cuentas, ve a <button class="link inl" onClick=${()=>go('settings')}>Configuración</button>.</p>
  </div>`;
}

/* Gráficos */
const Donut=({items,total,center})=>{let off=0;const R=52,C=2*Math.PI*R;
  return html`<svg viewBox="0 0 132 132" role="img" aria-label=${center}><circle cx="66" cy="66" r=${R} fill="none" stroke="var(--sunk)" stroke-width="18"/>
   ${items.map(([k,v,c])=>{const len=v/total*C;const el=html`<circle key=${k} cx="66" cy="66" r=${R} fill="none" stroke=${c} stroke-width="18" stroke-dasharray=${`${Math.max(len-2,0.5)} ${C}`} stroke-dashoffset=${-off} transform="rotate(-90 66 66)"/>`;off+=len;return el})}
   <text x="66" y="62" text-anchor="middle" style=${{font:'800 15px Nunito,sans-serif',fill:'var(--ink)'}}>${fmt(total)}</text><text x="66" y="80" text-anchor="middle" style=${{font:'12px Inter,sans-serif',fill:'var(--ink2)'}}>gastado</text></svg>`};
const Line=({cur,prev,labels})=>{const W=330,H=120,max=Math.max(...cur,...prev,1),x=i=>8+i*(W-16)/Math.max(cur.length-1,1),y=v=>H-14-v/max*(H-26);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return html`<svg class="spark" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" role="img" aria-label=${`Gasto acumulado: ${fmt(cur[cur.length-1])}`}>
   <path d=${`M8 ${H-14}H${W-8}`} stroke="var(--line)"/>
   ${prev.length>0&&html`<path d=${path(prev)} fill="none" stroke="var(--ink2)" stroke-width="2" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>`}
   <path d=${path(cur)+` L${x(cur.length-1)} ${H-14} L8 ${H-14}Z`} fill="var(--primary-soft)" opacity=".7"/>
   <path d=${path(cur)} fill="none" stroke="var(--primary)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
   <circle cx=${x(cur.length-1)} cy=${y(cur[cur.length-1])} r="4" fill="var(--primary)"/></svg>
   <div class="bx"><span style=${{textAlign:'left'}}>${labels[0]}</span><span style=${{textAlign:'right'}}>${labels[1]}</span></div>`};

function Stats({s,ui,set}){
  const r=RANGES[ui.period], tab=ui.statsTab;
  const medium=e=>tab==='general'||(tab==='efectivo'?e.acc==='efectivo':e.acc!=='efectivo');
  const ex=s.expenses.filter(e=>inR(e.date,r)&&medium(e)), spent=sum(ex,e=>e.amount);
  const incs=s.incomes.filter(i=>inR(i.date,r)), inc=sum(incs,i=>i.type==='Préstamo recibido'?0:i.amount);
  const byCat=Object.entries(ex.reduce((m,e)=>(m[e.cat]=(m[e.cat]||0)+e.amount,m),{})).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[c,v,catInfo(c)[1]]);
  const n=days(r[0],r[1])+1, dayList=Array.from({length:n},(_,i)=>addDays(r[0],i));
  const cum=a=>{let t=0;return a.map(v=>t+=v)};
  const perDay=(list,ds)=>ds.map(dd=>sum(list.filter(e=>e.date===dd),e=>e.amount));
  const cur=cum(perDay(ex,dayList));
  const prevDays=ui.period==='mes'?dayList.map(x=>'2026-10'+x.slice(7)):dayList.map(x=>addDays(x,-n));
  const prev=ui.period==='ant'?[]:cum(perDay(s.expenses.filter(e=>medium(e)),prevDays));
  const weeks=[];for(let i=0;i<n;i+=7)weeks.push(dayList.slice(i,i+7));
  const wk=weeks.map(w=>[w[0],sum(incs.filter(x=>w.includes(x.date)),x=>x.amount),sum(ex.filter(e=>w.includes(e.date)),e=>e.amount)]);
  const wmax=Math.max(1,...wk.flatMap(w=>[w[1],w[2]]));
  const cashBal=s.bal.efectivo, digBal=totalBal(s)-cashBal;
  const reserved=sum(s.plans.filter(p=>p.status==='activo'),p=>p.reserved);
  const has=s.expenses.length+s.incomes.length>0;
  return html`<div>
   <div class="chips" role="group" aria-label="Periodo">${Object.entries(RANGES).map(([k,v])=>html`<button key=${k} class="chip" aria-pressed=${ui.period===k} onClick=${()=>set({period:k})}>${v[2]}</button>`)}</div>
   <div class="tabs" role="tablist" aria-label="Vista" style=${{marginTop:'6px'}}>${[['general','General'],['efectivo','Efectivo'],['digital','Digital']].map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} onClick=${()=>set({statsTab:k})}>${l}</button>`)}</div>

/* ======================= Compromisos ======================= */
function Compromisos({s,go}){
  const due=upcoming(s), mes=sum(due.filter(x=>x.date<='2026-11-30'&&x.kind!=='Gasto futuro'),x=>x.amount);
  const subsM=sum(s.subs.filter(x=>x.active),x=>x.price*SUBF[x.freq][0]);
  const debtsL=sum(s.debts,debtLeft), active=s.entities.filter(e=>!e.retired), avail=sum(active,e=>Math.max(0,e.limit-entUsed(s,e)));
  const plansA=s.plans.filter(p=>p.status==='activo');
  const mods=[['repeat','Suscripciones',`${s.subs.filter(x=>x.active).length} activas · ${fmt(subsM)} al mes`,'subs'],['target','Gastos futuros',`${plansA.length} ${plansA.length===1?'plan activo':'planes activos'} · ${fmt(sum(plansA,p=>p.reserved))} reservados`,'plans'],
   ['debt','Deudas y préstamos',`Saldo por pagar ${fmt(debtsL)}`,'debts'],['card','Créditos de compra',active.length?`${active.length} ${active.length===1?'entidad':'entidades'} · disponible ${fmt(avail)}`:'Sin entidades','credits']];
  return html`<div>
   <div class="card"><small class="mut">Por pagar en lo que queda de noviembre</small><span class="amt" style=${{fontSize:'30px',display:'block'}}>${fmt(mes)}</span><p class="caption" style=${{marginTop:'2px'}}>Suscripciones y cuotas. Los gastos futuros se cubren con lo que reservas.</p></div>
   <${SecHead} title="Módulos"><//>
   <div class="card menu" style=${{paddingBlock:'2px'}}>${mods.map(([ic,t,sub,to])=>html`<button class="row" key=${t} onClick=${()=>go(to)}><span class="bub"><${I} n=${ic} s=${20}/></span><span><span class="t" style=${{display:'block'}}>${t}</span><span class="s" style=${{display:'block'}}>${sub}</span></span><${I} n="chev" s=${18}/></button>`)}</div>
   <${SecHead} title="Próximos pagos"><//>
   <div class="card">${due.length?due.map(x=>html`<${Due} x=${x} key=${x.key} onOpen=${()=>go(x.to)}/>`):html`<${Empty} title="Nada pendiente" text="No tienes pagos o planes próximos."/>`}</div>
  </div>`;
}

function Subs({s,open,menu,confirm,dispatch,toast}){
  const act=s.subs.filter(x=>x.active), canc=s.subs.filter(x=>!x.active);
  const m=sum(act,x=>x.price*SUBF[x.freq][0]);
  const Card=({x})=>{const n=days(TODAY,x.next);return html`<div class=${'card subc'+(x.active?'':' off')}>
    <div class="h3"><span class="bub"><${I} n="repeat" s=${20}/></span><span><b>${x.name}</b><span class="mut">${fmt(x.price)} · ${x.freq.toLowerCase()} · ${accOf(x.acc).name}</span></span>
     <button class="ib" aria-label=${'Acciones de '+x.name} onClick=${()=>menu({title:x.name,items:x.active?[['pencil','Editar',()=>open('subForm',x)],['clock','Historial',()=>open('subHist',x)],['x','Cancelar suscripción',()=>confirm({title:'¿Cancelar esta suscripción?',body:'Su historial de pagos y gastos se conservará.',ok:'Cancelar suscripción',cancel:'Volver',danger:true,icon:'repeat',action:()=>{dispatch({t:'subActive',id:x.id,on:false});toast('Suscripción cancelada. Su historial sigue guardado.')}}),true]]
       :[['undo','Reactivar',()=>{dispatch({t:'subActive',id:x.id,on:true});toast('Suscripción reactivada.')}],['clock','Historial',()=>open('subHist',x)]]})}><${I} n="dots"/></button></div>
    ${x.active?html`<div class="subn"><span>Próximo cobro <b>${longDate(x.next)}</b></span><${Tag} kind=${n<=7?'warn':'soft'} icon=${n<=7?'alert':null}>${n===0?'Próximo cobro hoy':dueLabel(x.next)}<//></div>
     <div class="row2"><button class="btn p sm" onClick=${()=>open('subPay',x)}>Pagar</button><button class="btn s sm" onClick=${()=>open('subHist',x)}>Historial</button></div>`
     :html`<div class="row2"><${Tag}>Cancelada<//><button class="btn s sm" onClick=${()=>{dispatch({t:'subActive',id:x.id,on:true});toast('Suscripción reactivada.')}}>Reactivar</button></div>`}
   </div>`};
  return html`<div>
   <p class="lead">Ten a la vista tus cobros recurrentes.</p>
   <div class="card"><${Vals} items=${[['Estimado mensual',fmt(m)],['Compromiso anual estimado',fmt(m*12)]]}/>
    <button class="btn p" style=${{marginTop:'14px'}} onClick=${()=>open('subForm')}><${I} n="plus"/>Agregar suscripción</button></div>
   <${Note} icon="lock">Los pagos solo se registran cuando confirmas la acción. No hay cobros automáticos.<//>
   <${SecHead} title="Activas"><span class="mut">${act.length}</span><//>
   ${act.length?act.sort((a,b)=>a.next.localeCompare(b.next)).map(x=>html`<${Card} x=${x} key=${x.id}/>`):html`<div class="card"><${Empty} title="Todavía no tienes suscripciones" text="Agrega tus cobros recurrentes y consulta cuánto representan cada mes." action="Agregar la primera" onAction=${()=>open('subForm')}/></div>`}
   ${canc.length>0&&html`<div><${SecHead} title="Canceladas"><span class="mut">${canc.length}</span><//>${canc.map(x=>html`<${Card} x=${x} key=${x.id}/>`)}</div>`}
  </div>`;
}

function Plans({s,ui,set,open,menu,confirm,dispatch,toast}){
  const st=ui.planTab, list=s.plans.filter(p=>p.status===st), total=totalBal(s);

    const items=p.status==='activo'?[['pencil','Editar plan',()=>open('planForm',p)],['check','Marcar como completado',()=>{dispatch({t:'planStatus',id:p.id,st:'completado'});toast('Estado actualizado.')}],['db','Archivar',()=>{dispatch({t:'planStatus',id:p.id,st:'archivado'});toast('Estado actualizado.')}],

      :[['undo','Volver a activar',()=>{dispatch({t:'planStatus',id:p.id,st:'activo'});toast('Estado actualizado.')}],['trash','Eliminar plan',()=>p.reserved?confirm({title:'Primero libera el dinero',body:'Libera primero el dinero reservado para poder eliminar el plan.',icon:'lock'}):confirm({title:'¿Borrar este plan?',body:'Se eliminará el plan. No podrás deshacerlo.',ok:'Eliminar plan',danger:true,icon:'trash',action:()=>{dispatch({t:'delPlan',id:p.id});toast('Plan eliminado.')}}),true]];
    return html`<div class="card planc">
     <div class="h3"><span class="bub" style=${{color:catInfo(p.cat)[1]}}><${I} n=${catInfo(p.cat)[0]} s=${20}/></span><span><b>${p.name}</b><span class="mut">${p.cat} · ${p.freq} · para el ${longDate(p.due)}</span></span>
      <button class="ib" aria-label=${'Acciones de '+p.name} onClick=${()=>menu({title:p.name,items})}><${I} n="dots"/></button></div>
     <${Vals} items=${[['Necesitas',fmt(p.need)],['Planeas guardar',fmt(p.plan)],['Reservado de verdad',fmt(p.reserved),'pos'],['Todavía falta',fmt(left),left?'':'pos']]}/>
     <${Bar} value=${p.reserved} total=${p.need} label=${`Reservado ${pct(p.reserved,p.need)} % de lo que necesitas`}/>
     <p class="caption">${p.reserved?`${pct(p.reserved,p.need)} % reservado en ${accOf(p.resAcc).name}.`:'Aún no has reservado dinero para este plan.'}${p.notes?' '+p.notes+'.':''}</p>
     ${late&&html`<p class="warnline"><${I} n="alert" s=${16}/>La fecha ya pasó. Puedes ajustar el plan para ponerte al día.</p>`}

     ${p.status==='activo'&&html`<div class="row2"><button class="btn p sm" disabled=${!planLeft(p)} onClick=${()=>open('reserve',p)}>Reservar</button>${p.reserved>0&&html`<button class="btn s sm" onClick=${()=>open('release',p)}>Liberar reserva</button>`}</div>`}
     ${p.status!=='activo'&&html`<div class="row2"><${Tag}>${p.status==='completado'?'Completado':'Archivado'}<//><button class="btn s sm" onClick=${()=>{dispatch({t:'planStatus',id:p.id,st:'activo'});toast('Estado actualizado.')}}>Volver a activar</button></div>`}

  const Card=({x})=>{const left=debtLeft(x),done=left<=0;return html`<div class="card debtc">
    <div class="h3"><span class="bub"><${I} n=${x.entity?'card':'debt'} s=${20}/></span><span><b>${x.name}</b><span class="mut">${x.entity?'Crédito de compra':'Deuda'} · desde ${dayLabel(x.date)}</span></span>
     <${Tag} kind=${done?'ok':'warn2'}>${done?'Pagada':'Pendiente'}<//></div>
    <${Vals} items=${[['Monto original',fmt(x.orig)],['Total pagado',fmt(x.paid),'pos'],['Saldo restante',fmt(left),done?'':'neg'],['Cuota',`${fmt(x.quota)} · ${Math.min(x.paidQ,x.n)} de ${x.n}`]]}/>
    <${Bar} value=${x.paid} total=${x.orig} color="var(--pos)" label=${`Pagado ${pct(x.paid,x.orig)} %`}/>
    ${x.hist>0&&html`<p class="caption"><${Tag} icon="clock">${x.hist} ${x.hist===1?'cuota':'cuotas'} como dato histórico<//> no descontaron dinero ni crearon gastos.</p>`}
    ${!done&&x.next&&html`<p class="caption">Próximo pago: <b>${longDate(x.next)}</b> · ${dueLabel(x.next)}</p>`}
    <div class="row2">${!done&&html`<button class="btn p sm" onClick=${()=>open('debtPay',x)}>Registrar abono</button>`}<button class="btn s sm" onClick=${()=>open('debtHist',x)}>Historial (${x.pays.length})</button>
     <button class="ib" aria-label=${'Acciones de '+x.name} onClick=${()=>menu({title:x.name,items:[...(x.hist?[['clock','Revisar dato histórico',()=>confirm({title:'Dato histórico de cuotas',body:`${x.hist} ${x.hist===1?'cuota se marcó':'cuotas se marcaron'} como pagadas al crear la deuda. Se conservará como referencia histórica: el total pagado lo incluye, pero no hubo movimiento de dinero.`,ok:'Conservar referencia',icon:'clock',action:()=>toast('Referencia guardada para tenerla presente.')})]]:[]),
       ['trash','Borrar deuda',()=>confirm({title:'¿Borrar esta deuda?',body:'Se borrará junto con su historial de pagos. No podrás deshacerlo.',ok:'Borrar deuda',cancel:'Conservar',danger:true,icon:'trash',action:()=>{dispatch({t:'delDebt',id:x.id});toast('Deuda borrada junto con su historial.')}}),true]]})}><${I} n="dots"/></button></div>
   </div>`};

    <p class="caption">${base.filter(x=>debtLeft(x)>0).length} pendientes · las compras a crédito se registran desde <button class="link inl" onClick=${()=>go('credits')}>Créditos de compra</button>.</p>

     <span class="bub" style=${{color:catInfo(x.cat)[1]}}><${I} n=${catInfo(x.cat)[0]} s=${20}/></span>
     <span><b>${x.name.split(' · ')[1]||x.name}</b><span class="mut">${dayLabel(x.date)} · ${x.cat||'Compra'} · ${Math.min(x.paidQ,x.n)} de ${x.n} cuotas</span><${Bar} value=${x.paid} total=${x.orig} color="var(--pos)"/></span>
     <span class="right"><span class="amt">${fmt(x.orig)}</span><span class="mut" style=${{fontSize:'12px'}}>${debtLeft(x)>0?'debe '+fmt(debtLeft(x)):'pagada'}</span></span></div>`)

      <span class="bub" style=${{background:m.type==='Aporte'?'var(--primary-soft)':'var(--sunk)',color:m.type==='Aporte'?'var(--primary)':'var(--ink2)'}}><${I} n=${m.type==='Aporte'?'piggy':'out'} s=${20}/></span>
      <span><span class="t" style=${{display:'block'}}>${m.type==='Aporte'?'Aporte a tus ahorros':'Retiro de ahorros'}</span><span class="s" style=${{display:'block'}}>${m.type==='Aporte'?'Desde':'Hacia'} ${accOf(m.acc).name} · ${dayLabel(m.date)}</span></span>
      <span class=${'amt '+(m.type==='Aporte'?'':'mut')} style=${{color:m.type==='Aporte'?'var(--primary)':null}}>${m.type==='Aporte'?'+':'−'}${fmt(m.amount)}</span></div>`)
     :html`<${Empty} cat="ahorros" title="Tu primer aporte empieza aquí" text="Separa un poquito de lo que recibes y míralo crecer." action="Separar dinero" onAction=${()=>open('saving',{type:'Aporte'})}/>`}</div>
   </div>`:html`<div>
    <div class="card"><${Vals} items=${[['Prestado',fmt(lent)],['Devuelto',fmt(back),'pos'],['Pendiente por cobrar',fmt(pend),pend?'warn':'']]}/>
     <button class="btn p" style=${{marginTop:'14px'}} onClick=${()=>open('loan')}><${I} n="hand" s=${20}/>Prestar dinero</button></div>
    <${Note}>Es dinero que le prestaste a otras personas. No es tu ahorro ni una deuda tuya.<//>
    <${SecHead} title="Préstamos"><span class="mut">${s.loans.length}</span><//>
    ${s.loans.length?s.loans.map(l=>{const [st,k]=status(l),left=l.amount-l.returned,late=left>0&&l.due&&l.due<TODAY;return html`<div class="card loanc" key=${l.id}>
      <div class="h3"><span class="bub"><${I} n="user" s=${20}/></span><span><b>${l.person}</b><span class="mut">Entregado el ${longDate(l.date)} desde ${accOf(l.acc).name}</span></span><${Tag} kind=${k}>${st}<//></div>
      <${Vals} items=${[['Prestado',fmt(l.amount)],['Devuelto',fmt(l.returned),'pos'],['Pendiente',fmt(left),left?'warn':'']]}/>
      <${Bar} value=${l.returned} total=${l.amount} color="var(--pos)" label=${`Devuelto ${pct(l.returned,l.amount)} %`}/>
      ${l.due&&left>0&&html`<p class=${late?'warnline':'caption'}>${late?html`<${I} n="alert" s=${16}/>`:''}Devolución acordada: ${longDate(l.due)} · ${dueLabel(l.due)}</p>`}
      <div class="row2">${left>0&&html`<button class="btn p sm" onClick=${()=>open('loanRet',l)}>Registrar devolución</button>`}<button class="btn s sm" onClick=${()=>open('loanHist',l)}>Devoluciones (${l.rets.length})</button></div>
     </div>`})

function Settings({s,ui,set,open,menu,confirm,dispatch,toast}){

  const delCat=c=>{const u=used(c);
    if(c==='Suscripción')return confirm({title:'Esta categoría es necesaria para el historial',body:'La categoría Suscripción se conserva para tu historial de pagos.',icon:'lock'});
    if(u)return confirm({title:'Esta categoría está en uso y no se puede quitar',body:`Tiene ${u} ${u===1?'registro asociado':'registros asociados'}. Quitarla dejaría ese historial sin categoría.`,icon:'lock'});
    if(s.cats.filter(x=>x!=='Suscripción').length<=1)return confirm({title:'Necesitas al menos una categoría',body:'Deja al menos una categoría para organizar tus gastos.',icon:'info'});
    confirm({title:'¿Quitar esta categoría?',body:`«${c}» ya no aparecerá al registrar gastos.`,ok:'Quitar categoría',cancel:'Conservar',danger:true,icon:'trash',action:()=>{dispatch({t:'delCat',c});toast('Categoría quitada.')}});};
  const delAcc=a=>accHasHistory(s,a.id)||s.bal[a.id]?confirm({title:'Esta cuenta tiene historial',body:'Las cuentas con movimientos no se eliminan, para proteger tu historial. Puedes cambiarle el nombre.',icon:'lock'})
    :confirm({title:'¿Eliminar esta cuenta?',body:`«${a.name}» no tiene movimientos. Se quitará de tu lista.`,ok:'Eliminar cuenta',cancel:'Conservar',danger:true,icon:'trash',action:()=>{dispatch({t:'delAcc',id:a.id});toast('Cuenta eliminada.')}});
  const trMenu=t=>menu({title:`${accOf(t.from).name} → ${accOf(t.to).name} · ${fmt(t.amount)}`,items:[['pencil','Editar transferencia',()=>open('transfer',t)],
    ['undo','Revertir',()=>confirm({title:'¿Revertir esta transferencia?',body:'Se revertirán ambos movimientos y el saldo volverá al origen.',ok:'Revertir',cancel:'Conservar',danger:true,icon:'undo',action:()=>{dispatch({t:'revertTransfer',tr:t});toast('Transferencia revertida.')}}),true]]});
  return html`<div>
   <p class="lead">Personaliza tus preferencias locales.</p>
   <div class="card setsec"><h3>Tu nombre</h3>
    <label class="fl" for="cfg-name" style=${{marginTop:'8px'}}>Nombre</label>
    <div class="inl-add" style=${{marginTop:0}}><input id="cfg-name" class="field" value=${name} onInput=${e=>setName(e.target.value)}/><button class="btn s sm" onClick=${()=>{setTried(true);if(!nameOk)return;set({userName:nn});setTried(false);toast('Nombre guardado.')}}>Guardar nombre</button></div>
    <${Err} m=${tried&&!nameOk&&'Usa solo letras españolas y espacios entre nombres.'}/></div>
   <div class="card setsec"><h3>Categorías de gastos</h3><span class="mut">Las categorías con gastos no se pueden quitar, para proteger tu historial.</span>
    ${s.cats.map(c=>{const u=used(c),prot=c==='Suscripción';return html`<div class="srow" key=${c}><span class="bub" style=${{color:catInfo(c)[1]}}><${I} n=${catInfo(c)[0]} s=${18}/></span>
      <span><b>${c}</b><span class="mut">${prot?'Necesaria para conservar el historial de suscripciones':u?`${u} ${u===1?'registro':'registros'} · en uso`:'Disponible para nuevos gastos'}</span></span>
      <span class="acts"><button class="ib" aria-label=${'Editar '+c} disabled=${prot} onClick=${()=>open('catForm',{name:c})}><${I} n="pencil" s=${18}/></button><button class="ib" aria-label=${'Quitar '+c} onClick=${()=>delCat(c)}>${prot||u?html`<${I} n="lock" s=${18}/>`:html`<${I} n="trash" s=${18}/>`}</button></span></div>`})}
    <button class="btn o" onClick=${()=>open('catForm')}><${I} n="plus" s=${18}/>Agregar categoría</button></div>
   <div class="card setsec"><h3>Cuentas digitales</h3><span class="mut">Agrega las que uses; no crearemos bancos por ti.</span>
    ${ACC.filter(a=>a.kind==='digital').length?ACC.filter(a=>a.kind==='digital').map(a=>{const h=accHasHistory(s,a.id);return html`<div class="srow" key=${a.id}><span class="bub" style=${{color:a.color}}><${I} n=${a.icon} s=${18}/></span>
      <span><b>${a.name}</b><span class="mut">${fmt(s.bal[a.id]||0)} · ${h?'con historial':'sin movimientos'}</span></span>
      <span class="acts"><button class="ib" aria-label=${'Editar '+a.name} onClick=${()=>open('accForm',a)}><${I} n="pencil" s=${18}/></button><button class="ib" aria-label=${'Eliminar '+a.name} onClick=${()=>delAcc(a)}>${h?html`<${I} n="lock" s=${18}/>`:html`<${I} n="trash" s=${18}/>`}</button></span></div>`})
     :html`<p class="mut" style=${{fontSize:'14px'}}>Aún no tienes cuentas digitales. Agrega las que uses; no crearemos bancos por ti.</p>`}
    <button class="btn o" onClick=${()=>open('accForm')}><${I} n="plus" s=${18}/>Agregar cuenta digital</button></div>

    <div class="srow"><span class="bub"><${I} n="sun" s=${18}/></span><span><b>Tema</b><span class="mut">Claro · Oscuro</span></span><${Tag}>Próximamente<//></div></div>
   <div class="card setsec"><h3>Datos locales</h3><span class="mut">Los registros se almacenan en este dispositivo. No se sincronizan con otros celulares.</span>
    <button class="btn dd" onClick=${()=>confirm({title:'¿Borrar todos tus datos?',body:'Se borrarán ingresos, gastos, deudas, préstamos, ahorros, planes de gastos futuros y sus reservas. Las categorías se conservarán. No podrás deshacerlo.',ok:'Sí, borrar todo',cancel:'Conservar mis datos',danger:true,icon:'trash',action:()=>{dispatch({t:'wipe'});toast('Listo, borramos tus datos financieros.')}})}><${I} n="trash" s=${18}/>Borrar todos los datos</button></div>
  </div>`;
}

function ExpenseSheet({s,dispatch,close,toast,edit,confirm}){

  const amt=Number(f.amount||0), avail=(s.bal[f.acc]||0)+(edit&&edit.acc===f.acc?edit.amount:0), left=avail-amt;
  const errs={amount:!amt?'Escribe un monto mayor que cero.':left<0?'El saldo de esta cuenta es insuficiente.':'',name:!f.name.trim()?'Escribe el nombre del gasto.':'',cat:!f.cat?'Elige una categoría.':''};

   <label class="fl" for="g-nombre">Nombre del gasto</label><input id="g-nombre" class="field" placeholder="Ej. Compra semanal" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/><${Err} m=${tried&&errs.name}/>

  <//>`;

function TransferSheet({s,dispatch,close,toast,edit}){

   ${Sh&&html`<${Sh} ...${P_} edit=${ui.edit} key=${ui.sheet+(ui.edit&&ui.edit.id||'')}/>`}`}

   ${ui.dlg&&html`<${Dialog} dlg=${ui.dlg} close=${()=>set({dlg:null})}/>`}
   ${ui.toast&&html`<div class="toast" role="status" key=${ui.toast.id}>${ui.toast.ok!==false?html`<${Cat} k="exitoso" size="S"/>`:html`<span style=${{padding:'0 6px'}}><${I} n="info" s=${20}/></span>`}<span>${ui.toast.m}</span></div>`}
  </div>`;
