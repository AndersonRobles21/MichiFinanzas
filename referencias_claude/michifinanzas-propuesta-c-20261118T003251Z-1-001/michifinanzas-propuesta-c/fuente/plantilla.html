<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MichiFinanzas propuesta C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: cálido, cercano y ordenado; una app de dinero que se siente de casa sin verse infantil.
IDEA: la libreta de cuentas de la casa, con un gato que acompaña; crema como papel, berenjena como tinta.
PICTURE: el teléfono mismo, a tamaño real (393 × 852), navegable, y su gemelo oscuro al lado.
COLOUR and TYPE: crema #FFF8EF, berenjena #5B2A86, calicó y amarillo solo decorativos; Nunito para cifras y títulos, Inter para texto.
LAYOUT: cabecera con controles, teléfono(s) centrados, especificaciones debajo.
*/
:root{color-scheme:light dark;--page:light-dark(#F4EADC,#120E18);--page-ink:light-dark(#2B1E36,#FFF4E6);--page-ink2:light-dark(#6E6077,#C4B6CF);--page-line:light-dark(#E2D3BF,#2E2638);--page-card:light-dark(#FFFDF9,#1C1625)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--page);color:var(--page-ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
.shell{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 48px}
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.top h1{font:800 clamp(26px,3.4vw,38px)/1.05 Nunito,sans-serif;margin:0 0 6px;text-wrap:balance}
.top p{margin:0;color:var(--page-ink2);max-width:62ch}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--page-card);border:1px solid var(--page-line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px;font-weight:600;font-size:14px;color:var(--page-ink2)}
.seg button[aria-pressed=true]{background:#5B2A86;color:#FFF8EF}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--page-line);background:var(--page-card);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:40px;font-size:14px}
.jump button[aria-pressed=true]{border-color:#5B2A86;box-shadow:inset 0 0 0 1px #5B2A86;font-weight:600}
.stage{display:flex;flex-wrap:wrap;justify-content:center;gap:32px}
.label{font:700 14px Nunito,sans-serif;color:var(--page-ink2);text-align:center;margin-bottom:22px}
.specs{margin-top:44px;background:var(--page-card);border:1px solid var(--page-line);border-radius:20px;padding:clamp(18px,3vw,32px)}
.specs h2{font:800 24px/1.1 Nunito,sans-serif;margin:0 0 6px}.specs h3{font:700 17px Nunito,sans-serif;margin:24px 0 10px}
.specs p{margin:0 0 10px;color:var(--page-ink2);max-width:75ch}
.tok{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tok div{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 8px;border:1px solid var(--page-line);border-radius:10px}
.tok i{width:28px;height:28px;border-radius:8px;flex:none;border:1px solid rgba(0,0,0,.12)}
.tok b{display:block;font-weight:600}.tok span{color:var(--page-ink2);font-family:ui-monospace,Consolas,monospace;font-size:12px}
.scroll{overflow-x:auto}
table.sp{border-collapse:collapse;width:100%;font-size:14px}table.sp th,table.sp td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--page-line);vertical-align:top}table.sp th{font-weight:600;color:var(--page-ink2);font-size:13px}
.note{font-size:13px;color:var(--page-ink2);margin-top:12px}

/* ============ Teléfono y temas de la app ============ */
.t-light{--bg:#FFF8EF;--surface:#FFFFFF;--sunk:#F8EEE2;--hero:#5B2A86;--on-hero:#FFF8EF;--on-hero2:#E6D6F2;--ink:#2B1E36;--ink2:#6E6077;--line:#EFE3D3;--field:#9C8F80;
 --primary:#5B2A86;--on-primary:#FFFFFF;--primary-soft:#EFE4F7;--pos:#237A50;--pos-soft:#E3F2E9;--neg:#C03636;--neg-soft:#FDEEEC;--warn:#8A5300;--warn-soft:#FFF1D6;
 --orange:#F2994A;--yellow:#F6C744;--plate:#FFF1DF;--shadow:0 1px 2px rgba(91,42,134,.06),0 8px 24px rgba(91,42,134,.07);--nav:#FFFFFF;--scrim:rgba(43,30,54,.38);
 --c1:#5B2A86;--c2:#F2994A;--c3:#E0B12E;--c4:#B48AD8;--c5:#8C5A3C;--c6:#E8A598;--c7:#7A6E86}
.t-dark{--bg:#1C1625;--surface:#271F33;--sunk:#211A2C;--hero:#3A2B52;--on-hero:#FFF4E6;--on-hero2:#D9C7EE;--ink:#FFF4E6;--ink2:#C4B6CF;--line:#3A3047;--field:#7E6F8C;
 --primary:#C9A7F0;--on-primary:#1C1625;--primary-soft:#3B2D52;--pos:#6FD3A0;--pos-soft:rgba(111,211,160,.14);--neg:#FF8C82;--neg-soft:rgba(255,140,130,.14);--warn:#F6C744;--warn-soft:rgba(246,199,68,.13);
 --orange:#F2A766;--yellow:#F6C744;--plate:#F6EADB;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);--nav:#231C2E;--scrim:rgba(8,5,12,.6);
 --c1:#C9A7F0;--c2:#F2A766;--c3:#F6C744;--c4:#8E62B8;--c5:#C79474;--c6:#F0B8AE;--c7:#A79BB3}
.phone{width:393px;height:852px;border-radius:44px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;box-shadow:0 0 0 10px #241B2E,0 0 0 11px #3A2E45,0 30px 60px rgba(30,15,40,.25);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;isolation:isolate}
@media(max-width:440px){.stage>div{width:100%}.phone{width:100%;height:min(852px,calc(100svh - 40px));border-radius:28px;box-shadow:0 0 0 6px #241B2E}}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font:600 14px Inter;color:var(--ink)}
.status span:last-child{display:flex;gap:5px;align-items:center}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 20px}
.bar h2{font:800 20px/1 Nunito,sans-serif;margin:0;flex:1;letter-spacing:.1px}
.bar .back{margin-left:-10px}
.ib{width:44px;height:44px;border:0;background:none;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--sunk)}
.body{flex:1;overflow-y:auto;padding:4px 16px 104px;scrollbar-width:thin}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.amt{font-family:Nunito,sans-serif;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--ink2)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec h3{font:800 17px Nunito,sans-serif;margin:0}
.link{border:0;background:none;color:var(--primary);font-weight:600;font-size:14px;cursor:pointer;padding:10px 4px;margin:-10px -4px;display:inline-flex;align-items:center;gap:2px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.t-dark .card{box-shadow:none;border:1px solid var(--line)}
:where(.phone) :focus-visible{outline:3px solid var(--primary);outline-offset:2px}
/* Gatos: tres tamaños; placa clara detrás cuando el fondo es oscuro */
.cat{position:relative;display:inline-grid;place-items:center;flex:none}
.cat img{position:relative;width:100%;height:100%;object-fit:contain}
.cat-L{width:148px;height:132px}.cat-M{width:96px;height:88px}.cat-S{width:44px;height:42px}
.cat.plate::before,.t-dark .cat::before{content:"";position:absolute;inset:6% 4% 2%;border-radius:50%;background:var(--plate)}
/* Inicio */
.hello{margin:2px 2px 14px;color:var(--ink2);font-size:15px}.hello b{color:var(--ink);font-weight:600}
.hero{position:relative;background:var(--hero);color:var(--on-hero);border-radius:24px;padding:18px 18px 16px;margin-top:30px}
.hero .cat{position:absolute;right:10px;top:-34px}
.hero small{display:block;color:var(--on-hero2);font-size:14px;padding-right:104px}
.hero .big{font-size:38px;line-height:1.1;margin:4px 0 14px;display:block}
.phone{container-type:inline-size}
@container (max-width:380px){.hero .big{font-size:31px}.qa{font-size:12.5px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split button{border:0;text-align:left;background:rgba(255,248,239,.1);color:var(--on-hero);border-radius:14px;padding:10px 12px;cursor:pointer;min-height:44px}
.split button[aria-expanded=true]{background:rgba(255,248,239,.18)}
.split small{padding:0;display:flex;align-items:center;gap:6px}.split .amt{font-size:18px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.acclist{margin:10px 0 0;padding:0;list-style:none;border-top:1px solid rgba(255,248,239,.16)}
.acclist li{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;font-size:14px;border-bottom:1px solid rgba(255,248,239,.1)}
.acclist li span:first-child{display:flex;align-items:center;gap:8px}
.hero .more{width:100%;border:0;background:none;color:var(--on-hero);font-weight:600;display:flex;justify-content:center;align-items:center;gap:4px;padding:12px 0 2px;cursor:pointer;min-height:44px;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 2px;line-height:1.25;display:grid;justify-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);min-height:84px}
.t-dark .qa{box-shadow:none;border:1px solid var(--line)}
.qa i{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.qa.in i{background:var(--pos-soft);color:var(--pos)}.qa.out i{background:var(--neg-soft);color:var(--neg)}.qa.tr i{background:var(--primary-soft);color:var(--primary)}
.month{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.metric small{display:block;color:var(--ink2);font-size:13px}.metric .amt{font-size:21px}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.caption{font-size:13px;color:var(--ink2);margin:8px 0 0}
.saving{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px;font-size:14px}
/* Próximos pagos */
.due{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.due:last-child{border-bottom:0;padding-bottom:2px}.due:first-child{padding-top:2px}
.date{width:52px;height:52px;border-radius:14px;background:var(--sunk);display:grid;place-content:center;text-align:center;line-height:1.05}
.date b{font:800 19px Nunito,sans-serif}.date span{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--ink2);letter-spacing:.4px}
.due .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.due .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.soft{background:var(--sunk);color:var(--ink2)}.tag.lock{background:var(--sunk);color:var(--ink2)}
.right{text-align:right;display:grid;justify-items:end;gap:3px}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--primary)}
/* Movimientos */
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.row:last-child{border-bottom:0}
.bub{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.debt{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sunk) 8px 9px);border-radius:14px;padding-inline:8px;margin:4px -8px;width:calc(100% + 16px);border:1px dashed var(--line)}
.day{font:700 13px Inter;color:var(--ink2);margin:16px 2px 4px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;margin:2px 0 14px}
.tabs button{border:0;background:none;border-radius:11px;min-height:40px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap;font-size:14px;padding:0 4px}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.t-dark .tabs button[aria-selected=true]{background:var(--primary-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;cursor:pointer;min-height:38px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.monthsel{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 6px}
.monthsel b{font:800 17px Nunito,sans-serif}
.sum .amt.big{font-size:32px;display:block;line-height:1.15}
.catbar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0 10px;gap:2px}
.catbar i{height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.leg span{display:inline-flex;align-items:center;gap:6px}
/* Cuentas */
.dist{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:3px;margin:14px 0 12px}
.dist i{height:100%;border-radius:3px}
.acc{width:100%;border:0;text-align:left;cursor:pointer;color:var(--ink);display:block;margin-bottom:10px}
.acc .h{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.acc .amt{font-size:19px}
.acc ul{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:14px}
.acc li{display:flex;justify-content:space-between;padding:4px 0;gap:10px}
.btn{border:0;border-radius:16px;min-height:52px;padding:0 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%}
.btn.p{background:var(--primary);color:var(--on-primary)}.btn.s{background:var(--primary-soft);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--ink2);margin:10px 2px 0}
/* Estadísticas */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis div{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.t-dark .kpis div{box-shadow:none;border:1px solid var(--line)}
.kpis small{display:block;font-size:12px;color:var(--ink2)}.kpis .amt{font-size:16px}
.donut{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.donut svg{width:132px;height:132px}
.lg{list-style:none;margin:0;padding:0;font-size:13px}
.lg li{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:4px 0}
.lg li b{font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars .g{flex:1;display:flex;gap:4px;align-items:flex-end;height:100%;justify-content:center}
.bars i{width:min(22px,40%);border-radius:7px 7px 2px 2px;display:block;min-height:2px}
.bx{display:flex;gap:12px;font-size:12px;color:var(--ink2);margin-top:6px}.bx span{flex:1;text-align:center}
.spark{width:100%;height:120px;display:block}
.acct{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.acct:last-child{border-bottom:0}
.acct .t{font-weight:600;display:flex;align-items:center;gap:8px}
.acct .meter{grid-column:1/-1;margin-top:8px;height:8px}
.note2{display:flex;gap:8px;font-size:13px;color:var(--ink2);background:var(--sunk);border-radius:14px;padding:10px 12px;margin-top:12px}
/* Más y compromisos */
.menu .row{padding:12px 0}
.soon{font-size:12px;color:var(--ink2)}
/* Navegación inferior */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 18px;z-index:5}
.nav button{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:14px}
.nav button[aria-current=page]{color:var(--primary)}
.nav button[aria-current=page] .ic{stroke-width:2.3}
.nav .reg i{width:54px;height:54px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(91,42,134,.35);border:4px solid var(--nav)}
.nav .reg{color:var(--ink)}
/* Hojas inferiores */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:28px 28px 0 0;z-index:11;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.t-dark .sheet{background:#2B2238}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sh{display:flex;align-items:center;padding:6px 10px 2px 20px}.sh h3{font:800 20px Nunito,sans-serif;margin:0;flex:1}
.sb{overflow-y:auto;padding:6px 20px 16px}
.sf{padding:12px 20px 22px;border-top:1px solid var(--line);flex:none}
@keyframes up{from{transform:translateY(40%);opacity:.3}}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast{animation:none}}
.opt{display:grid;grid-template-columns:48px 1fr 20px;gap:14px;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;margin-bottom:10px;text-align:left;cursor:pointer;color:var(--ink)}
.t-dark .opt{background:var(--sunk)}
.opt i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center}
.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--ink2)}
.money{display:grid;justify-items:center;padding:6px 0 4px}
.money label{font-size:13px;color:var(--ink2);font-weight:600}
.money .inp{display:flex;align-items:baseline;gap:4px;font:800 40px Nunito,sans-serif;color:var(--ink)}
.money input{font:inherit;color:inherit;border:0;background:none;max-width:260px;text-align:left;padding:0;outline:none;font-variant-numeric:tabular-nums}
.money .line{width:220px;height:2px;background:var(--line);border-radius:2px;margin-top:2px}
.money:focus-within .line{background:var(--primary)}
.fl{display:block;font-size:14px;font-weight:600;margin:16px 0 8px}
.field{width:100%;border:1.5px solid var(--field);border-radius:14px;background:var(--surface);color:var(--ink);font:16px Inter,sans-serif;padding:12px 14px;min-height:50px}
.t-dark .field{background:var(--sunk)}
.field:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.err{color:var(--neg);font-size:13px;margin:6px 2px 0;display:flex;gap:6px;align-items:center}
.picker{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.pk{flex:none;width:122px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.t-dark .pk{background:var(--sunk)}
.pk[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);background:var(--primary-soft)}

.btn.d{background:var(--neg);color:#fff}.t-dark .btn.d{color:#1C1625}
.btn.dd{background:none;border:1.5px solid var(--neg);color:var(--neg);min-height:48px;font-size:15px}
.tag.ok{background:var(--pos-soft);color:var(--pos)}.tag.warn2{background:var(--warn-soft);color:var(--warn)}
.cnt{display:inline-block;min-width:20px;font-size:12px;background:var(--sunk);border-radius:99px;padding:0 6px;margin-left:4px}

.reco{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:8px 12px;margin:10px 0 0}

.prow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.saving{width:100%;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.due{width:100%;border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.entc .cupo{margin-top:12px}

.dlg-ic{width:48px;height:48px;border-radius:16px;display:inline-grid;place-items:center;background:var(--primary-soft);color:var(--primary)}.dlg-ic.neg{background:var(--neg-soft);color:var(--neg)}
.dlg-a{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dlg-a .btn:only-child{grid-column:1/-1}
.dlg-a .btn{min-height:48px;font-size:15px;padding:0 10px}
.skel{height:84px;border-radius:20px;background:linear-gradient(90deg,var(--sunk) 0 40%,var(--surface) 50%,var(--sunk) 60% 100%);background-size:300% 100%;animation:shim 1.4s linear infinite;margin-bottom:12px}
